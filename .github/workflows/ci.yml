name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DeadGround.sln
      - name: Build all projects
        run: dotnet build DeadGround.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DeadGround.sln --configuration Release --no-build --logger trx
      - name: Headless simulation smoke test
        run: dotnet run --project src/Game.Server --configuration Release --no-build -- --smoke-test
      - name: Launcher path and argument regression test
        if: runner.os != 'Windows'
        run: |
          bash tests/toolchain-version-smoke.sh
          bash tests/launcher-smoke.sh
          bash tests/export-smoke.sh
      - name: PowerShell toolchain version regression test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/toolchain-version-smoke.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DeadGround.sln
      - name: Verify C# code formatting
        run: dotnet format DeadGround.sln --verify-no-changes --no-restore
      - name: Build with analyzers
        run: dotnet build DeadGround.sln --configuration Release --no-restore

  export-macos:
    needs: [test, quality]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Resolve Godot version
        run: echo "GODOT_VERSION=$(bash tools/godot-version.sh)" >> "$GITHUB_ENV"
      - name: Install pinned Godot .NET
        run: |
          curl -fSL -o godot_macos.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          unzip -q godot_macos.zip
          echo "GODOT_BIN=$PWD/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Install Godot export templates
        run: bash tools/install-templates.sh
      - name: Export macOS client
        run: bash tools/export-client.sh macOS build/export/macos/DeadGround.zip
      - name: Validate exported macOS client smoke test
        timeout-minutes: 2
        run: |
          mkdir -p build/export/macos/extracted
          unzip -q build/export/macos/DeadGround.zip -d build/export/macos/extracted
          codesign --verify --deep --strict --verbose=2 "./build/export/macos/extracted/Dead Ground.app"
          "./build/export/macos/extracted/Dead Ground.app/Contents/MacOS/Dead Ground" --headless -- --smoke-test | tee macos-smoke.log
          grep -Fxq 'M0_CLIENT_SMOKE_OK' macos-smoke.log
      - name: Upload macOS client package
        uses: actions/upload-artifact@v6
        with:
          name: deadground-client-macos-universal
          path: build/export/macos/DeadGround.zip
          if-no-files-found: error

  export-windows:
    needs: [test, quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Resolve Godot version
        shell: pwsh
        run: |
          . ./tools/godot-version.ps1
          $godotVersion = Get-GodotVersion -RepositoryRoot $PWD.Path
          "GODOT_VERSION=$godotVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install pinned Godot .NET
        shell: pwsh
        run: |
          $releaseTag = "$($env:GODOT_VERSION)-stable"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/$releaseTag/Godot_v${releaseTag}_mono_win64.zip" -OutFile "godot_win.zip"
          Expand-Archive -Path "godot_win.zip" -DestinationPath "$env:RUNNER_TEMP\godot"
          $godotExe = (Get-ChildItem -Path "$env:RUNNER_TEMP\godot" -Recurse -Filter "Godot_v${releaseTag}_mono_win64_console.exe").FullName
          if (-not $godotExe) { throw 'Godot console executable was not found in the downloaded archive.' }
          & $godotExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version command failed.' }
          "GODOT_BIN=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Godot export templates
        shell: pwsh
        run: ./tools/install-templates.ps1
      - name: Export Windows client
        shell: pwsh
        run: ./tools/export-client.ps1 -Preset 'Windows Desktop' -Output 'build/export/windows/DeadGround.exe'
      - name: Validate exported Windows client smoke test
        timeout-minutes: 2
        shell: pwsh
        run: |
          $smokeOutput = & "build/export/windows/DeadGround.console.exe" --headless -- --smoke-test 2>&1
          $smokeExitCode = $LASTEXITCODE
          $smokeOutput | Write-Output
          if ($smokeExitCode -ne 0) { throw "Exported Windows smoke test failed with exit code $smokeExitCode" }
          if ($smokeOutput -notcontains 'M0_CLIENT_SMOKE_OK') { throw 'Exported client did not complete the smoke test.' }
      - name: Package Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path "build\export\windows\*" -DestinationPath "build\export\DeadGround-windows-x64.zip"
      - name: Upload Windows client package
        uses: actions/upload-artifact@v6
        with:
          name: deadground-client-windows-x64
          path: build/export/DeadGround-windows-x64.zip
          if-no-files-found: error
