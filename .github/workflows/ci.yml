name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DeadGround.sln
      - name: Build all projects
        run: dotnet build DeadGround.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DeadGround.sln --configuration Release --no-build --logger trx
      - name: Headless simulation smoke test
        run: dotnet run --project src/Game.Server --configuration Release --no-build -- --smoke-test
      - name: Launcher path and argument regression test
        if: runner.os != 'Windows'
        run: bash tests/launcher-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
